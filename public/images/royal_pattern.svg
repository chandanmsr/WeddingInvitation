<svg xmlns="http://www.w3.org/2000/svg" width="100" height="140" viewBox="0 0 100 140">
  <defs>
    <!-- Royal Indian Buti / Mughal Damask Crest -->
    <g id="royal-buti" fill="#bfa574" opacity="0.48">
      <!-- 1. Crown / Tiara Finial & Radiating Pearls -->
      <circle cx="0" cy="-23" r="1.4" />
      <circle cx="-4" cy="-21.4" r="1.1" />
      <circle cx="4" cy="-21.4" r="1.1" />
      <circle cx="-7.8" cy="-18.8" r="0.95" />
      <circle cx="7.8" cy="-18.8" r="0.95" />
      <circle cx="-11.2" cy="-15.2" r="0.8" />
      <circle cx="11.2" cy="-15.2" r="0.8" />
      <circle cx="-13.8" cy="-11" r="0.75" />
      <circle cx="13.8" cy="-11" r="0.75" />

      <!-- Center kalangi plume leaf -->
      <path d="M0 -22 C-1.8 -19.5 -2.2 -16.5 0 -14.8 C2.2 -16.5 1.8 -19.5 0 -22 Z" />
      <!-- Flanking plume leaves -->
      <path d="M-2.5 -20 C-5 -18 -5.5 -15.5 -3.2 -14 C-2 -15 -1.6 -17.5 -2.5 -20 Z" />
      <path d="M2.5 -20 C5 -18 5.5 -15.5 3.2 -14 C2 -15 1.6 -17.5 2.5 -20 Z" />

      <!-- 2. Central Arch & Floral Medallion -->
      <!-- Inner pointed teardrop petal -->
      <path d="M0 -13.5 C-3.2 -11 -3.8 -7.5 0 -4.2 C3.8 -7.5 3.2 -11 0 -13.5 Z" />
      <circle cx="0" cy="-9" r="1.2" />

      <!-- Surrounding scalloped arch framing -->
      <path d="M0 -14.8 C-5.8 -12 -8.5 -7.2 -7.2 -2 C-6.2 2.2 -2.5 2.8 0 3 C2.5 2.8 6.2 2.2 7.2 -2 C8.5 -7.2 5.8 -12 0 -14.8 M0 -12.8 C-4.2 -10.5 -6 -6.5 -5.2 -2.2 C-4.5 0.8 -1.8 1.4 0 1.5 C1.8 1.4 4.5 0.8 5.2 -2.2 C6 -6.5 4.2 -10.5 0 -12.8" fill-rule="evenodd" />

      <!-- Lateral scrolling wings with curved acanthus leaves -->
      <path d="M-6.2 -11 C-10.8 -11.8 -13.5 -8 -12.4 -3.8 C-11.5 0.2 -7.5 0.5 -5.2 -1.8 C-7 -1 -9.5 -1.5 -10 -4.2 C-10.5 -6.8 -8.5 -9.2 -5.5 -8.8 Z" />
      <path d="M6.2 -11 C10.8 -11.8 13.5 -8 12.4 -3.8 C11.5 0.2 7.5 0.5 5.2 -1.8 C7 -1 9.5 -1.5 10 -4.2 C10.5 -6.8 8.5 -9.2 5.5 -8.8 Z" />

      <!-- Lateral bead accents -->
      <circle cx="-13" cy="-9.2" r="0.9" />
      <circle cx="13" cy="-9.2" r="0.9" />
      <circle cx="-14.5" cy="-4.5" r="0.95" />
      <circle cx="14.5" cy="-4.5" r="0.95" />
      <circle cx="-13.2" cy="0.6" r="0.85" />
      <circle cx="13.2" cy="0.6" r="0.85" />

      <!-- 3. Waist Pediment Band -->
      <path d="M-8 3.5 Q0 2 8 3.5 Q0 5 -8 3.5 Z" />
      <circle cx="0" cy="3.5" r="1" />

      <!-- 4. Flared Peacock Tail / Scalloped Skirt Flutes -->
      <!-- Center vertical flute -->
      <path d="M-1.1 5 C-1.8 9 -2 14.5 0 18 C2 14.5 1.8 9 1.1 5 Z" />
      <!-- Left & Right Flutes 1 -->
      <path d="M-2 5 C-3.5 9 -5.2 14 -4.2 17 C-3 17 -2 11.2 -1.2 5 Z" />
      <path d="M2 5 C3.5 9 5.2 14 4.2 17 C3 17 2 11.2 1.2 5 Z" />
      <!-- Left & Right Flutes 2 -->
      <path d="M-3.6 4.8 C-5.8 8.5 -8.5 12.8 -8 15.5 C-6.6 15.5 -4.8 10.5 -2.6 4.8 Z" />
      <path d="M3.6 4.8 C5.8 8.5 8.5 12.8 8 15.5 C6.6 15.5 4.8 10.5 2.6 4.8 Z" />
      <!-- Left & Right Flutes 3 (curving outward) -->
      <path d="M-5.4 4.5 C-8.2 7.6 -11.8 11 -12 13.2 C-10.8 13.5 -7.8 9 -4.2 4.5 Z" />
      <path d="M5.4 4.5 C8.2 7.6 11.8 11 12 13.2 C10.8 13.5 7.8 9 4.2 4.5 Z" />
      <!-- Left & Right Flutes 4 (outermost flare) -->
      <path d="M-7.2 4.2 C-10.8 6.5 -14.5 9 -15.2 10.8 C-14.2 11.2 -10.5 7.5 -5.8 4.2 Z" />
      <path d="M7.2 4.2 C10.8 6.5 14.5 9 15.2 10.8 C14.2 11.2 10.5 7.5 5.8 4.2 Z" />

      <!-- Scallop teardrop tips at skirt base -->
      <circle cx="0" cy="19.5" r="0.9" />
      <circle cx="-4.2" cy="18.5" r="0.85" />
      <circle cx="4.2" cy="18.5" r="0.85" />
      <circle cx="-8" cy="16.6" r="0.8" />
      <circle cx="8" cy="16.6" r="0.8" />
      <circle cx="-12" cy="14" r="0.75" />
      <circle cx="12" cy="14" r="0.75" />
      <circle cx="-15.2" cy="11.5" r="0.7" />
      <circle cx="15.2" cy="11.5" r="0.7" />
    </g>

    <!-- Secondary Quatrefoil Floret Motif -->
    <g id="royal-floret" fill="#bfa574" opacity="0.44">
      <circle cx="0" cy="0" r="1.5" />
      <!-- 4 Pointed Diamond Petals -->
      <path d="M0 -1.8 C-1.8 -3.6 -1.8 -6.5 0 -8.5 C1.8 -6.5 1.8 -3.6 0 -1.8 Z" />
      <path d="M0 1.8 C-1.8 3.6 -1.8 6.5 0 8.5 C1.8 6.5 1.8 3.6 0 1.8 Z" />
      <path d="M-1.8 0 C-3.6 -1.8 -6.5 -1.8 -8.5 0 C-6.5 1.8 -3.6 1.8 -1.8 0 Z" />
      <path d="M1.8 0 C3.6 -1.8 6.5 -1.8 8.5 0 C6.5 1.8 3.6 1.8 1.8 0 Z" />
      <!-- 4 Diagonal Corner Beads -->
      <circle cx="-4.5" cy="-4.5" r="0.95" />
      <circle cx="4.5" cy="-4.5" r="0.95" />
      <circle cx="-4.5" cy="4.5" r="0.95" />
      <circle cx="4.5" cy="4.5" r="0.95" />
    </g>
  </defs>

  <!-- Staggered Half-Drop Repeat Grid -->
  <!-- Main Buti Crests -->
  <use href="#royal-buti" x="50" y="70" />
  <use href="#royal-buti" x="0" y="0" />
  <use href="#royal-buti" x="100" y="0" />
  <use href="#royal-buti" x="0" y="140" />
  <use href="#royal-buti" x="100" y="140" />

  <!-- Secondary Florets -->
  <use href="#royal-floret" x="50" y="0" />
  <use href="#royal-floret" x="50" y="140" />
  <use href="#royal-floret" x="0" y="70" />
  <use href="#royal-floret" x="100" y="70" />
</svg>